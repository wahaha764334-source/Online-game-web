<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實驗體 ONLINE - 忘記密碼</title>
    <style>
        /* 底層控制 */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Noto Sans TC', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 忘記密碼卡片外框 */
        .forgot-box {
            background-color: #0f0f0f;
            border: 1px solid #222;
            border-top: 3px solid #d4af37; /* 頂部金邊 */
            border-radius: 4px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
        }

        .forgot-box h3 {
            font-size: 1.5rem;
            color: #d4af37;
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .forgot-desc {
            font-size: 0.95rem;
            color: #aaa;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* 表單與輸入框 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .form-group input:focus {
            border-color: #e51b24; /* 戰鬥紅 */
            outline: none;
        }

        /* 按鈕系統 */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #e51b24; /* 紅色大按鈕 */
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            font-family: 'Noto Sans TC', sans-serif;
            margin-bottom: 15px;
        }

        .btn-submit:hover {
            background-color: #b31218;
        }

        .btn-back {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #333; /* 灰色按鈕 */
            border: none;
            color: #ccc;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.3s, color 0.3s;
            box-sizing: border-box;
        }

        .btn-back:hover {
            background-color: #444;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="forgot-box">
        <h3>密碼找回中心</h3>
        <p class="forgot-desc">請輸入您註冊時填寫的電子信箱，系統將會發送密碼重設驗證連結給您。</p>
        
        <form action="#" method="POST">
            <!-- 帳號輸入 -->
            <div class="form-group">
                <label for="username">遊戲帳號 (Account)</label>
                <input type="text" id="username" name="username" placeholder="請輸入您的帳號" required>
            </div>

            <!-- 信箱輸入 -->
            <div class="form-group">
                <label for="email">註冊電子信箱 (Email)</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <!-- 送出按鈕 -->
            <button type="submit" class="btn-submit">發送重設驗證信</button>
            
            <!-- 返回首頁/登入頁 -->
            <a href="index.html" class="btn-back">返回登入首頁</a>
        </form>
    </div>

</body>
</html>
