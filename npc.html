                    <button type="button" id="submit-login-btn" style="display: block; text-align: center; width: 100%; padding: 14px 0; background: linear-gradient(90deg, #ff0055, #990033); border: none; color: white; font-family: 'Orbitron'; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; box-shadow: 0 0 10px #ff0055; margin-bottom: 15px; box-sizing: border-box;">登入會員</button>
                    
                    <!-- 下方小按鈕 -->
                    <div class="btn-sub-group" style="display: flex; gap: 10px; width: 100%;">
                        <a href="register.html" class="btn-secondary" style="display: block; text-align: center; text-decoration: none; flex: 1; padding: 12px 0; background: #333; border: none; color: #ccc; font-family: 'Noto Sans TC'; font-size: 0.95rem; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.3s; box-sizing: border-box;">註冊帳號</a>
                        <a href="forgot-password.html" class="btn-secondary" style="display: block; text-align: center; text-decoration: none; flex: 1; padding: 12px 0; background: #333; border: none; color: #ccc; font-family: 'Noto Sans TC'; font-size: 0.95rem; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.3s; box-sizing: border-box;">忘記密碼</a>
                    </div>
                </form>
            `;

            // 2. 綁定點擊事件，進行身分驗證與分流
            var loginBtn = document.getElementById('submit-login-btn');
            if (loginBtn) {
                loginBtn.addEventListener('click', function() {
                    var accountInput = document.getElementById('login-acc').value.trim();
                    var passwordInput = document.getElementById('login-pwd').value.trim();

                    // 【身分 A】管理者登入
                    if ((accountInput === "admin_test" || accountInput === "admin") && passwordInput === "123456") {
                        alert("⚔️ 管理權限驗證通過！即將進入系統後台矩陣。");
                        window.location.href = "admin.html"; // 管理者後台檔案
                    } 
                    // 【身分 B】普通會員登入
                    else if (accountInput === "user" && passwordInput === "1234") {
                        alert("👋 玩家歡迎回來！即將進入個人會員中心。");
                        window.location.href = "dashboard.html"; // 普通會員後台檔案
                    } 
                    // 【錯誤提示】
                    else {
                        alert("❌ 驗證失敗：帳號或密碼輸入錯誤。\n\n測試提示：\n• 管理者：admin / 123456\n• 一般玩家：user / 1234");
                    }
                });
            }
        }
    });
</script>
